syntax = "proto3";

import "google/protobuf/wrappers.proto";

package ecommerce;

service OrderManagement {
  prc getOrder(google.protobuf.StringValue) returns (Order);
}

message Order {
  string id = 1;
  repeated string items = 2;
  string description = 3;
  float proce = 4;
  string destination = 5;
}
